
<script>
let currentFilter='all',hindi=false;function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');filterTools()}
function filterTools(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.tool').forEach(c=>{let group=c.closest('[data-grid]').dataset.grid;let ok=(currentFilter==='all'||group===currentFilter)&&c.innerText.toLowerCase().includes(q);c.classList.toggle('hide',!ok)});document.querySelectorAll('[data-cat-title]').forEach(t=>{let grid=t.nextElementSibling;let visible=[...grid.querySelectorAll('.tool')].some(c=>!c.classList.contains('hide'));t.style.display=visible?'flex':'none';grid.style.display=visible?'grid':'none'})}
function toggleLang(){hindi=!hindi;document.documentElement.lang=hindi?'hi':'en';document.querySelectorAll('[data-en]').forEach(e=>e.textContent=hindi?e.dataset.hi:e.dataset.en);document.getElementById('langBtn').textContent=hindi?'English':'हिंदी';document.getElementById('search').placeholder=hindi?'⌕  AI टूल खोजें...':'⌕  Search your AI tool...'}
// Interactive starfield
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');let stars=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:Math.min(150,Math.floor(innerWidth/7))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.7+.3,s:Math.random()*.45+.08,p:Math.random()*6.28}))}function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);stars.forEach(a=>{a.y-=a.s;if(a.y<0){a.y=innerHeight;a.x=Math.random()*innerWidth}a.p+=.025;ctx.beginPath();ctx.arc(a.x,a.y,a.r,0,Math.PI*2);ctx.fillStyle=`rgba(120,225,255,${.25+Math.abs(Math.sin(a.p))*.65})`;ctx.shadowBlur=8;ctx.shadowColor='#42f5ff';ctx.fill()});requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw();
// Gentle pointer tilt on larger screens
if(matchMedia('(pointer:fine)').matches){document.querySelectorAll('.tool').forEach(c=>{c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`translateY(-7px) rotateX(${-y*9}deg) rotateY(${x*9}deg)`});c.addEventListener('mouseleave',()=>c.style.transform='')})}
</script></body></html>
