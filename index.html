
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartAITools - 50 AI Tools</title>
<meta name="description" content="Explore 50 AI tools for writing, images, video, voice and productivity.">
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050713;color:#fff;
 font-family:Arial,sans-serif;overflow-x:hidden;
 background-image:radial-gradient(ellipse at 50% 0%,#25104c 0%,#090d20 45%,#03050b 100%);
}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header,main,footer{position:relative;z-index:1}
header{
 text-align:center;padding:35px 15px 15px;
 background:linear-gradient(120deg,#070b1b,#241044,#071c35);
 border-bottom:1px solid #8b5cf655;
}
.logo{
 font-size:clamp(32px,7vw,58px);font-weight:900;
 background:linear-gradient(90deg,#facc15,#fff,#38bdf8,#c084fc);
 background-clip:text;-webkit-background-clip:text;color:transparent;
 text-shadow:0 0 25px #38bdf855;
 animation:logoGlow 3s infinite alternate;
}
@keyframes logoGlow{
 from{filter:drop-shadow(0 0 3px #38bdf8)}
 to{filter:drop-shadow(0 0 18px #a855f7)}
}
header p{color:#cbd5e1}
#lang{
 background:linear-gradient(90deg,#eab308,#facc15);
 border:0;border-radius:30px;padding:12px 22px;
 font-weight:bold;color:#111;cursor:pointer
}
.hero{
 min-height:330px;display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 perspective:1000px;text-align:center;overflow:hidden;
}
.orb{
 width:145px;height:145px;border-radius:50%;
 position:relative;
 background:radial-gradient(circle at 30% 25%,white 0%,#38bdf8 8%,#4338ca 35%,#180b38 65%,#050816 85%);
 box-shadow:0 0 30px #38bdf8,0 0 75px #7c3aed,inset -15px -15px 35px #000;
 animation:float 4s ease-in-out infinite,spin 12s linear infinite;
}
.orb:before,.orb:after{
 content:"";position:absolute;inset:-18px;
 border:2px solid #38bdf8;border-radius:50%;
 transform:rotateX(65deg) rotateY(20deg);
 box-shadow:0 0 18px #38bdf8;
}
.orb:after{
 inset:-29px;border-color:#facc15;
 transform:rotateX(70deg) rotateY(-35deg);
}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -20px}}
@keyframes spin{to{filter:hue-rotate(360deg)}}
.hero h2{
 font-size:clamp(25px,5vw,42px);margin:32px 0 5px;
 text-shadow:0 0 15px #38bdf8,0 0 30px #9333ea;
}
.hero p{color:#c4b5fd;margin:5px}
main{max-width:1200px;margin:auto;padding:15px}
.stats{
 text-align:center;padding:15px;border:1px solid #facc1566;
 border-radius:15px;color:#facc15;background:#facc150c;
 margin:10px 0 20px;font-weight:bold;
 box-shadow:0 0 20px #facc1515;
}
#search{
 width:100%;padding:16px;border-radius:14px;
 background:#101a30;border:1px solid #38bdf8;
 color:white;font-size:16px;outline:none;
 box-shadow:0 0 15px #38bdf822;
}
#search:focus{box-shadow:0 0 22px #38bdf866}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.filters button{
 padding:10px 15px;border-radius:30px;
 background:#111a30;color:#ddd;border:1px solid #7657a9;
 cursor:pointer;transition:.25s
}
.filters button:hover,.filters button.active{
 background:linear-gradient(100deg,#43308e,#075985);
 border-color:#38bdf8;box-shadow:0 0 15px #38bdf866;color:white
}
#tools{
 display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
 gap:17px
}
.tool{
 position:relative;overflow:hidden;
 background:linear-gradient(145deg,#172039,#090e1e);
 border:1px solid #6552a5;border-radius:17px;padding:19px;
 transform-style:preserve-3d;
 transition:transform .35s,box-shadow .35s,border-color .35s;
 animation:appear .55s ease both;
}
@keyframes appear{
 from{opacity:0;transform:translateY(20px) scale(.96)}
 to{opacity:1;transform:translateY(0) scale(1)}
}
.tool:before{
 content:"";position:absolute;top:0;left:-120%;
 width:60%;height:2px;
 background:linear-gradient(90deg,transparent,#38bdf8,#facc15,transparent);
 animation:shine 4s linear infinite
}
@keyframes shine{to{left:150%}}
.tool:hover{
 transform:translateY(-9px) rotateX(5deg) rotateY(-4deg) scale(1.025);
 border-color:#facc15;
 box-shadow:0 18px 35px #38bdf833,0 0 22px #a855f755
}
.tool h3{margin:0 0 10px;font-size:19px}
.tool .cat{font-size:12px;color:#facc15;letter-spacing:1px}
.tool p{font-size:14px;color:#c2cce0;line-height:1.5;min-height:38px}
.tool a{
 display:inline-block;margin-top:8px;padding:10px 15px;
 border-radius:9px;color:white;text-decoration:none;font-weight:bold;
 font-size:14px;background:linear-gradient(100deg,#2563eb,#7c3aed,#ca8a04);
 transition:.25s
}
.tool a:hover{filter:brightness(1.3);box-shadow:0 0 18px #a78bfa}
#count{text-align:center;color:#c4b5fd;margin:18px}
footer{
 text-align:center;padding:30px 15px;color:#aab3c7;
 border-top:1px solid #ffffff20;margin-top:35px
}
@media(max-width:520px){
 .hero{min-height:290px}
 #tools{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .tool{padding:13px}
 .tool h3{font-size:16px}
 .tool p{font-size:12px}
 .tool a{font-size:12px;padding:9px}
}
@media(max-width:340px){#tools{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="particles"></canvas>

<header>
 <div class="logo">✦ SmartAITools ✦</div>
 <p id="tagline">Explore 50 Powerful AI Tools in One Place</p>
 <button id="lang" onclick="toggleLang()">हिंदी में देखें</button>
</header>

<section class="hero">
 <div class="orb"></div>
 <h2 id="heroTitle">WELCOME TO THE FUTURE</h2>
 <p id="heroSub">✦ AI • CREATIVITY • TECHNOLOGY ✦</p>
</section>

<main>
 <div class="stats" id="stats">✨ 50 AI TOOLS AVAILABLE ✨</div>
 <input id="search" type="search"
 placeholder="🔍 Search your AI tool..." oninput="render()">
 <div class="filters" id="filters"></div>
 <div id="count"></div>
 <div id="tools"></div>
</main>

<footer>
 <h3>✦ SmartAITools ✦</h3>
 <p id="foot">Independent AI tools directory. External websites have their own terms and pricing.</p>
</footer>

<script>
const data=[
["ChatGPT","Writing","https://chatgpt.com/","AI assistant","AI सहायक"],
["Claude","Writing","https://claude.ai/","AI writing assistant","AI लेखन सहायक"],
["Google Gemini","Writing","https://gemini.google.com/","Google AI assistant","गूगल AI सहायक"],
["Microsoft Copilot","Writing","https://copilot.microsoft.com/","AI assistant","AI सहायक"],
["Perplexity","Writing","https://www.perplexity.ai/","AI search assistant","AI खोज सहायक"],
["Jasper","Writing","https://www.jasper.ai/","AI content writing","AI से लेखन"],
["Grammarly","Writing","https://www.grammarly.com/","Writing and grammar","लेखन और व्याकरण"],
["QuillBot","Writing","https://quillbot.com/","Paraphrasing assistant","लिखावट सुधारने का टूल"],
["DeepL Write","Writing","https://www.deepl.com/write","Writing improvement","लेखन सुधार"],
["Writesonic","Writing","https://writesonic.com/","AI content creation","AI से सामग्री बनाना"],
["Adobe Firefly","Images","https://firefly.adobe.com/","AI image creation","AI से तस्वीर बनाना"],
["Canva AI","Images","https://www.canva.com/","Design and AI images","डिजाइन और AI तस्वीरें"],
["Midjourney","Images","https://www.midjourney.com/","AI image generator","AI तस्वीर निर्माता"],
["Leonardo AI","Images","https://leonardo.ai/","AI image creation","AI तस्वीरें बनाना"],
["Ideogram","Images","https://ideogram.ai/","AI image generator","AI तस्वीर निर्माता"],
["Recraft","Images","https://www.recraft.ai/","AI design tool","AI डिजाइन टूल"],
["Playground","Images","https://playground.com/","AI image creation","AI तस्वीर बनाना"],
["Remove.bg","Images","https://www.remove.bg/","Remove image backgrounds","तस्वीर का बैकग्राउंड हटाएँ"],
["Clipdrop","Images","https://clipdrop.co/","AI image editing","AI तस्वीर एडिटिंग"],
["PhotoRoom","Images","https://www.photoroom.com/","Photo editing","फोटो एडिटिंग"],
["Runway","Video","https://runwayml.com/","AI video creation","AI वीडियो बनाना"],
["Pika","Video","https://pika.art/","AI video generator","AI वीडियो निर्माता"],
["Luma Dream Machine","Video","https://lumalabs.ai/dream-machine","AI video creation","AI वीडियो बनाना"],
["Kling AI","Video","https://klingai.com/","AI video generator","AI वीडियो निर्माता"],
["Synthesia","Video","https://www.synthesia.io/","AI avatar videos","AI अवतार वीडियो"],
["HeyGen","Video","https://www.heygen.com/","AI avatar videos","AI अवतार वीडियो"],
["InVideo AI","Video","https://invideo.io/","AI video maker","AI वीडियो मेकर"],
["VEED","Video","https://www.veed.io/","Online video editor","ऑनलाइन वीडियो एडिटर"],
["Descript","Video","https://www.descript.com/","Audio and video editing","ऑडियो और वीडियो एडिटिंग"],
["CapCut","Video","https://www.capcut.com/","Video editing","वीडियो एडिटिंग"],
["ElevenLabs","Voice","https://elevenlabs.io/","AI voice generation","AI आवाज बनाना"],
["Murf AI","Voice","https://murf.ai/","AI voiceovers","AI वॉइसओवर"],
["PlayHT","Voice","https://play.ht/","AI text to speech","टेक्स्ट से आवाज"],
["Speechify","Voice","https://speechify.com/","Text to speech","लिखे शब्द सुनना"],
["Suno","Voice","https://suno.com/","AI music creation","AI संगीत बनाना"],
["Udio","Voice","https://www.udio.com/","AI music creation","AI संगीत बनाना"],
["Adobe Podcast","Voice","https://podcast.adobe.com/","Audio enhancement","ऑडियो सुधार"],
["Krisp","Voice","https://krisp.ai/","Noise cancellation","आवाज का शोर हटाना"],
["Otter AI","Voice","https://otter.ai/","Meeting transcription","बातचीत लिखना"],
["Cleanvoice","Voice","https://cleanvoice.ai/","Audio cleanup","ऑडियो साफ करना"],
["Notion AI","Productivity","https://www.notion.so/product/ai","AI workspace","AI काम का प्लेटफॉर्म"],
["Gamma","Productivity","https://gamma.app/","AI presentations","AI प्रेजेंटेशन"],
["Zapier","Productivity","https://zapier.com/","Workflow automation","काम ऑटोमेट करना"],
["Make","Productivity","https://www.make.com/","Workflow automation","काम ऑटोमेट करना"],
["n8n","Productivity","https://n8n.io/","Automation platform","ऑटोमेशन प्लेटफॉर्म"],
["Cursor","Productivity","https://cursor.com/","AI coding editor","AI कोडिंग एडिटर"],
["Replit","Productivity","https://replit.com/","Online coding platform","ऑनलाइन कोडिंग"],
["Lovable","Productivity","https://lovable.dev/","Build apps with AI","AI से ऐप बनाना"],
["ClickUp AI","Productivity","https://clickup.com/ai","AI productivity","AI से काम व्यवस्थित करना"],
["NotebookLM","Productivity","https://notebooklm.google.com/","AI research assistant","AI रिसर्च सहायक"]
];

const categories=["All","Writing","Images","Video","Voice","Productivity"];
const hindiNames={
 All:"सभी टूल",Writing:"लेखन",Images:"तस्वीरें",
 Video:"वीडियो",Voice:"आवाज़ और संगीत",Productivity:"काम के टूल"
};
let hindi=false,selected="All";

function toggleLang(){
 hindi=!hindi;
 document.getElementById("lang").textContent=hindi?"View in English":"हिंदी में देखें";
 document.getElementById("tagline").textContent=hindi?
 "एक ही जगह 50 शानदार AI टूल खोजें":
 "Explore 50 Powerful AI Tools in One Place";
 document.getElementById("heroTitle").textContent=hindi?
 "भविष्य की दुनिया में आपका स्वागत है":"WELCOME TO THE FUTURE";
 document.getElementById("heroSub").textContent=hindi?
 "✦ AI • रचनात्मकता • तकनीक ✦":"✦ AI • CREATIVITY • TECHNOLOGY ✦";
 document.getElementById("stats").textContent=hindi?
 "✨ 50 AI टूल उपलब्ध हैं ✨":"✨ 50 AI TOOLS AVAILABLE ✨";
 document.getElementById("search").placeholder=hindi?
 "🔍 अपना AI टूल खोजें...":"🔍 Search your AI tool...";
 document.getElementById("foot").textContent=hindi?
 "AI टूल की स्वतंत्र सूची। हर वेबसाइट की अपनी शर्तें और कीमतें हैं।":
 "Independent AI tools directory. External websites have their own terms and pricing.";
 render();
}

function render(){
 const filters=document.getElementById("filters");
 filters.innerHTML="";
 categories.forEach(c=>{
  const b=document.createElement("button");
  b.textContent=hindi?hindiNames[c]:c;
  b.className=selected===c?"active":"";
  b.onclick=()=>{selected=c;render()};
  filters.appendChild(b);
 });
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=data.filter(t=>
  (selected==="All"||t[1]===selected)&&
  t.join(" ").toLowerCase().includes(q)
 );
 const area=document.getElementById("tools");
 area.innerHTML="";
 list.forEach(t=>{
  const card=document.createElement("article");
  card.className="tool";
  const h=document.createElement("h3");
  h.textContent="✦ "+t[0];
  const cat=document.createElement("div");
  cat.className="cat";
  cat.textContent=hindi?hindiNames[t[1]]:t[1];
  const p=document.createElement("p");
  p.textContent=hindi?t[4]:t[3];
  const a=document.createElement("a");
  a.href=t[2];a.target="_blank";
  a.rel="noopener noreferrer";
  a.textContent=hindi?"वेबसाइट खोलें ↗":"Visit Website ↗";
  card.append(h,cat,p,a);
  area.appendChild(card);
 });
 document.getElementById("count").textContent=
 (hindi?"दिखाए जा रहे टूल: ":"Showing tools: ")+list.length+" / 50";
 if(!list.length){
  area.textContent=hindi?"कोई टूल नहीं मिला।":"No tools found.";
 }
}

/* Floating animated stars */
const canvas=document.getElementById("particles");
const ctx=canvas.getContext("2d");
let dots=[];
function resizeCanvas(){
 canvas.width=window.innerWidth;
 canvas.height=window.innerHeight;
 dots=Array.from({length:65},()=>({
  x:Math.random()*canvas.width,
  y:Math.random()*canvas.height,
  r:Math.random()*2+0.5,
  vx:(Math.random()-.5)*.5,
  vy:(Math.random()-.5)*.5
 }));
}
function animateParticles(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 dots.forEach(d=>{
  d.x+=d.vx;d.y+=d.vy;
  if(d.x<0||d.x>canvas.width)d.vx*=-1;
  if(d.y<0||d.y>canvas.height)d.vy*=-1;
  ctx.beginPath();
  ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
  ctx.fillStyle="#7dd3fc";
  ctx.shadowBlur=12;
  ctx.shadowColor="#38bdf8";
  ctx.fill();
 });
 requestAnimationFrame(animateParticles);
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);
animateParticles();
render();
</script>
</body>
</html>
